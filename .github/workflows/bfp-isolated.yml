permissions: {}
jobs:
  buggy:
    runs-on: ubuntu-latest
    steps:
    - id: pg_v14_rev
      run: echo "pg_rev=fixture" >> "$GITHUB_OUTPUT"
    - id: pg_v15_rev
      run: echo "pg_rev=fixture" >> "$GITHUB_OUTPUT"
    - run: echo fixture > Makefile
